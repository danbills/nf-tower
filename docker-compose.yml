version: "3.8"

services:
  backend:
    build:
      context: ./tower-backend
    image: tower-backend:latest
    container_name: tower-backend
    ports:
      - "8080:8080"
    environment:
      - MICRONAUT_HOST=0.0.0.0
      - MICRONAUT_PORT=8080
      - TOWER_SERVER_URL=http://localhost:8000
    volumes:
      - ./data/db:/.db
    restart: unless-stopped

  frontend:
    build:
      context: ./tower-web
    image: tower-web:latest
    container_name: tower-web
    ports:
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: tower-network
